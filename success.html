<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gift sent — Tapsag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d16; --surface-solid: #131826; --line: #262d40;
    --text: #f3f1ea; --muted: #8c93a6; --gold: #e8b84b;
    --grad: linear-gradient(135deg, #fdb44b 0%, #e85d2c 100%);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--text); font-family:'Manrope', sans-serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 440px; margin: 0 auto; padding: 40px 20px 60px; }
  .check{ width:52px; height:52px; border-radius:50%; margin:0 auto 16px;
    background: var(--grad); display:flex; align-items:center; justify-content:center; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0 0 6px; text-align:center; }
  .sub{ color:var(--muted); font-size:14px; text-align:center; margin:0 0 28px; line-height:1.5; }
  .media-wrap{ border-radius:20px; overflow:hidden; border:1px solid var(--line); margin-bottom:20px; }
  .media-wrap img, .media-wrap video{ width:100%; display:block; }
  .card{ background: var(--surface-solid); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .ref{ color: var(--gold); font-weight:700; font-size:13px; letter-spacing:.5px; margin-bottom:8px; }
  .verse{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:19px; line-height:1.5; }
  .note{ margin-top:14px; color:var(--muted); font-size:14px; line-height:1.6; }
  .to-line{ text-align:center; color:var(--muted); font-size:13px; margin-top:18px; }
  .link-row{ text-align:center; margin-top:26px; display:flex; flex-direction:column; gap:10px; }
  a.btn{ color:var(--gold); font-weight:700; text-decoration:none; font-size:13px; }
  .loading, .err{ text-align:center; color:var(--muted); padding:80px 20px; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="loading" class="loading">Loading your gift…</div>
    <div id="err" class="err" style="display:none;">
      <p>We couldn't load the gift details, but if you completed checkout, it's still on its way.</p>
      <a class="btn" href="/">&larr; Back to Tapsag</a>
    </div>
    <div id="content" style="display:none;">
      <div class="check">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#1a0e02" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Your gift is on its way.</h1>
      <p class="sub" id="subline">It usually arrives within a few minutes.</p>

      <div class="media-wrap">
        <img id="img" style="display:none;" />
        <video id="video" style="display:none;" controls playsinline></video>
      </div>

      <div class="card">
        <div class="ref" id="ref"></div>
        <div class="verse" id="verse"></div>
        <div class="note" id="note" style="display:none;"></div>
      </div>

      <div class="to-line" id="toLine"></div>

      <div class="link-row">
        <a class="btn" href="/">&larr; Send another gift</a>
      </div>
    </div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const giftId = params.get('gift_id');
const loading = document.getElementById('loading');
const errEl = document.getElementById('err');
const content = document.getElementById('content');

if(!giftId){
  loading.style.display = 'none';
  errEl.style.display = 'block';
} else {
  fetch('/.netlify/functions/get-gift?id=' + encodeURIComponent(giftId))
    .then(res => { if(!res.ok) throw new Error('not found'); return res.json(); })
    .then(gift => {
      loading.style.display = 'none';
      content.style.display = 'block';

      document.getElementById('subline').textContent =
        'Sent successfully — the recipient will get their link shortly.';

      document.getElementById('ref').textContent = (gift.verse_ref || '').toUpperCase();
      document.getElementById('verse').textContent = '"' + gift.verse_text + '"';
      if(gift.personal_note){
        const n = document.getElementById('note');
        n.textContent = '— ' + gift.personal_note;
        n.style.display = 'block';
      }
      if(gift.recipient_name){
        document.getElementById('toLine').textContent = 'Sent to ' + gift.recipient_name;
      }
      if(gift.mediaType === 'video'){
        const v = document.getElementById('video');
        v.src = gift.mediaData;
        v.style.display = 'block';
      } else {
        const img = document.getElementById('img');
        img.src = gift.mediaData;
        img.style.display = 'block';
      }
    })
    .catch(() => {
      loading.style.display = 'none';
      errEl.style.display = 'block';
    });
}
</script>
</body>
</html>
