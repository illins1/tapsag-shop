<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gift sent — Tapsag</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0a0d16; color:#f3f1ea; font-family:'Manrope',sans-serif; text-align:center; padding:24px; }
  .card{ max-width:400px; }
  .check{ width:56px; height:56px; border-radius:50%; margin:0 auto 18px;
    background:linear-gradient(135deg,#fdb44b,#e85d2c); display:flex; align-items:center; justify-content:center; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0 0 10px; }
  p{ color:#8c93a6; font-size:14px; line-height:1.6; margin:0 0 22px; }
  a{ color:#e8b84b; font-weight:700; text-decoration:none; font-size:13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#1a0e02" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Your gift is on its way.</h1>
    <p>The verse has been sent by text. It usually arrives within a few minutes.</p>
    <a href="/">&larr; Send another gift</a>
  </div>
</body>
</html>
